[package]
name = "smcp"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
rand = "0.10.4"
rmcp = { version = "3.10.0", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
